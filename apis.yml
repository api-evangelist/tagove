name: Tagove
description: >-
  Tagove was a live chat, video chat, and co-browsing customer support platform
  (a 500 Global portfolio company) that now operates as Acquire.io. Acquire is
  an omnichannel customer support and conversational engagement platform whose
  developer platform (developer.acquire.io) exposes a REST API for
  conversations/cases, messages, contacts, companies, chatbots, knowledge base,
  analytics, and account settings, plus outbound HMAC-SHA256-signed webhooks,
  iOS/Android/JS SDKs, and an embeddable live-chat and co-browse widget. This
  profile was enriched from the Acquire developer documentation; no
  machine-readable OpenAPI is published.
